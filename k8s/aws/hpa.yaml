apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: techchallenger-api
  labels:
    app: techchallenger-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: techchallenger-api
  minReplicas: 1
  # 1 enquanto o node group for t3.micro: não há slot de pod para uma 2ª
  # réplica (limite de IPs do VPC CNI). Voltar para 5 ao migrar para t3.small+.
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70

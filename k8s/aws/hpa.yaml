apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: techchallenger-api
  labels:
    app: techchallenger-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: techchallenger-api
  # Decisão e dimensionamento em docs/adr/ADR-006-escalabilidade-com-hpa.md.
  # Com nodes t3.small (11 pods por node), 3 réplicas cabem junto dos pods de
  # sistema e do agente Datadog nos 2 nodes do node group.
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70

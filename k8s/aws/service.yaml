apiVersion: v1
kind: Service
metadata:
  name: techchallenger-api
  labels:
    app: techchallenger-api
spec:
  # Sem endereço público: o tráfego chega pelo API Gateway -> VPC Link -> NLB
  # interno -> nodes nesta porta. O nodePort precisa ser igual ao output
  # api_node_port do TechChallenger-infra-kubernetes (ADR-003).
  type: NodePort
  selector:
    app: techchallenger-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP

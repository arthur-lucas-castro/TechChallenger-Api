apiVersion: apps/v1
kind: Deployment
metadata:
  name: techchallenger-api
  labels:
    app: techchallenger-api
    tags.datadoghq.com/env: prod
    tags.datadoghq.com/service: techchallenger-api
    tags.datadoghq.com/version: VERSION_PLACEHOLDER
spec:
  # 1 réplica: com t3.micro cada node aceita só 4 pods (limite de IPs do VPC
  # CNI) e os pods de sistema ocupam 7 dos 8 slots do cluster.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: techchallenger-api
  template:
    metadata:
      labels:
        app: techchallenger-api
        # Unified service tagging: o admission controller do Datadog vira estes
        # labels em DD_ENV/DD_SERVICE/DD_VERSION e injeta o tracer .NET no pod.
        tags.datadoghq.com/env: prod
        tags.datadoghq.com/service: techchallenger-api
        tags.datadoghq.com/version: VERSION_PLACEHOLDER
        admission.datadoghq.com/enabled: "true"
      annotations:
        admission.datadoghq.com/dotnet-lib.version: "v3.55.2"
        # source csharp ativa o pipeline de logs C# do Datadog (status e trace_id).
        ad.datadoghq.com/techchallenger-api.logs: '[{"source":"csharp","service":"techchallenger-api"}]'
    spec:
      containers:
        - name: techchallenger-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: techchallenger-api-config
            - secretRef:
                name: techchallenger-api-secret
          resources:
            # Memória acima do que a API usa sozinha: o tracer .NET injetado consome ~50Mi.
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

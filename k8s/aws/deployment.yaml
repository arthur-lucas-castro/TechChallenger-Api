apiVersion: apps/v1
kind: Deployment
metadata:
  name: techchallenger-api
  labels:
    app: techchallenger-api
spec:
  # 1 réplica: com t3.micro cada node aceita só 4 pods (limite de IPs do VPC
  # CNI) e os pods de sistema ocupam 7 dos 8 slots do cluster.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: techchallenger-api
  template:
    metadata:
      labels:
        app: techchallenger-api
    spec:
      containers:
        - name: techchallenger-api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: techchallenger-api-config
            - secretRef:
                name: techchallenger-api-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

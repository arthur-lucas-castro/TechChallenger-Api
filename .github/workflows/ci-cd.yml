name: CI/CD Pipeline

# Fluxo de release: o PR de release/X.Y.Z para a main roda build e testes; o merge (push
# na main) publica a versão X.Y.Z no EKS. O disparo manual numa release/X.Y.Z serve para
# redeploy ou rollback de uma versão.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirma o deploy manual desta release (redeploy ou rollback)?"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

# Nomes fixos definidos pelo Terraform do TechChallenger-infra-kubernetes
# (variáveis cluster_name e ecr_repository_name). A URL do ECR depende do ID da
# conta AWS e é descoberta em tempo de execução.
# Parâmetros SSM publicados pelo workflow ssm-parameters.yml do TechChallenger-infra-kubernetes.
env:
  EKS_CLUSTER_NAME: techchallenger-fase1
  ECR_REPOSITORY_NAME: techchallenger-fase1
  DB_PARAM_PREFIX: /techchallenger/db
  JWT_SECRET_PARAM: /techchallenger/jwt/secret
  EMAIL_PARAM_PREFIX: /techchallenger/email

jobs:
  build-and-test:
    if: >
      github.event_name != 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src/**/*.csproj

      - name: Restaurar dependências (NuGet)
        run: dotnet restore src/TechChallenger-fase1.sln

      - name: Build da aplicação
        run: dotnet build src/TechChallenger-fase1.sln --no-restore --configuration Release

      - name: Rodar testes automatizados
        run: >
          dotnet test src/TechChallenger-fase1.sln
          --no-build --configuration Release
          --filter "FullyQualifiedName~Tests"
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Publicar resumo dos testes no Job Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultado dos Testes
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx

      - name: Upload dos resultados de teste e cobertura como artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
          retention-days: 15

  # Decide se há deploy e de qual versão. Um push na main só publica quando o commit veio
  # do merge de um PR de release/X.Y.Z; outros merges na main rodam apenas build e testes.
  resolve-version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - name: Descobrir a release que originou o deploy
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ github.event.inputs.confirm_deploy }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            branch=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq \
              '[.[] | select(.merged_at != null and .base.ref == "main" and (.head.ref | startswith("release/")))][0].head.ref // ""')
            if [ -z "$branch" ]; then
              echo "::notice::Commit na main sem PR de release/X.Y.Z: build e testes rodam, deploy não."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if [ "$CONFIRM" != "yes" ] || [[ "$REF_NAME" != release/* ]]; then
              echo "::notice::Deploy manual exige uma branch release/X.Y.Z e confirm_deploy=yes."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            branch="$REF_NAME"
          fi
          version="${branch#release/}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch '$branch' não segue o padrão release/X.Y.Z (ex: release/1.4.2)."
            exit 1
          fi
          echo "Deploy da versão $version (origem: $branch)."
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  build-and-push-image:
    needs: [build-and-test, resolve-version]
    if: needs.resolve-version.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: aws-deploy
    outputs:
      image-tag: ${{ needs.resolve-version.outputs.version }}
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Descobrir URL do repositório ECR
        run: |
          url=$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY_NAME" \
            --query 'repositories[0].repositoryUri' --output text)
          echo "ECR_REPOSITORY_URL=$url" >> "$GITHUB_ENV"

      - name: Login no Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src/**/*.csproj

      - name: Publish da aplicação (.NET)
        run: >
          dotnet publish src/Presentation/TechChallenger-fase1/TechChallenger-fase1.csproj
          --configuration Release
          --output ./publish
          -p:Version=$VERSION

      - name: Build da imagem Docker
        run: docker build -t "$ECR_REPOSITORY_URL:$VERSION" .

      - name: Push da imagem para o Amazon ECR
        run: docker push "$ECR_REPOSITORY_URL:$VERSION"

  deploy-k8s:
    needs: [resolve-version, build-and-push-image]
    if: needs.resolve-version.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: aws-deploy
    # Dois merges seguidos não aplicam manifestos ao mesmo tempo: o segundo espera.
    concurrency:
      group: deploy-eks
      cancel-in-progress: false
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Descobrir URL do repositório ECR
        run: |
          url=$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY_NAME" \
            --query 'repositories[0].repositoryUri' --output text)
          echo "ECR_REPOSITORY_URL=$url" >> "$GITHUB_ENV"

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Configurar kubeconfig do cluster EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region us-east-1

      - name: Atualizar tag da imagem e versão do Datadog no deployment.yaml
        run: |
          sed -i \
            -e "s#IMAGE_PLACEHOLDER#$ECR_REPOSITORY_URL:${{ needs.build-and-push-image.outputs.image-tag }}#" \
            -e "s#VERSION_PLACEHOLDER#\"${{ needs.build-and-push-image.outputs.image-tag }}\"#" \
            k8s/aws/deployment.yaml

      - name: Aplicar ConfigMap
        run: kubectl apply -f k8s/aws/configmap.yaml

      - name: Aplicar Secret (a partir do SSM)
        run: |
          param() {
            aws ssm get-parameter --name "$1" --with-decryption \
              --query 'Parameter.Value' --output text
          }
          db_host=$(param "$DB_PARAM_PREFIX/host")
          db_name=$(param "$DB_PARAM_PREFIX/name")
          db_username=$(param "$DB_PARAM_PREFIX/username")
          db_password=$(param "$DB_PARAM_PREFIX/password")
          jwt_secret=$(param "$JWT_SECRET_PARAM")
          email_host=$(param "$EMAIL_PARAM_PREFIX/host")
          email_username=$(param "$EMAIL_PARAM_PREFIX/username")
          email_password=$(param "$EMAIL_PARAM_PREFIX/password")
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$email_password"

          # Aspas na senha: um ';' nela encerraria o valor na connection string.
          kubectl create secret generic techchallenger-api-secret \
            --from-literal=ConnectionStrings__Default="Host=$db_host;Port=5432;Database=$db_name;Username=$db_username;Password=\"$db_password\"" \
            --from-literal=Jwt__SecretKey="$jwt_secret" \
            --from-literal=Email__Host="$email_host" \
            --from-literal=Email__Username="$email_username" \
            --from-literal=Email__Password="$email_password" \
            --dry-run=client -o yaml | kubectl apply -f - > /dev/null

      - name: Aplicar Deployment
        run: kubectl apply -f k8s/aws/deployment.yaml

      - name: Aplicar Service
        run: kubectl apply -f k8s/aws/service.yaml

      - name: Aplicar HPA
        run: kubectl apply -f k8s/aws/hpa.yaml

      # envFrom só é lido na criação do pod: sem o restart, um redeploy com a
      # mesma tag de imagem não recarrega alterações do Secret/ConfigMap.
      - name: Reiniciar pods para recarregar Secret e ConfigMap
        run: kubectl rollout restart deployment/techchallenger-api

      - name: Aguardar rollout do Deployment
        run: kubectl rollout status deployment/techchallenger-api --timeout=180s

      - name: Exibir endpoint público (API Gateway)
        run: |
          kubectl get service techchallenger-api -o wide
          endpoint=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='$EKS_CLUSTER_NAME-gateway'].ApiEndpoint | [0]" --output text)
          echo "API disponível em: $endpoint"
          echo "### Versão ${{ needs.build-and-push-image.outputs.image-tag }} publicada no EKS: $endpoint" >> "$GITHUB_STEP_SUMMARY"

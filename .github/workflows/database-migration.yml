name: Database Migration

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: "Confirma a execução da migração de banco no RDS (camada extra de confirmação)?"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

# Nome fixo definido pelo Terraform do TechChallenger-infra-kubernetes (variável cluster_name).
# Parâmetros SSM publicados pelo workflow ssm-parameters.yml do TechChallenger-infra-kubernetes.
env:
  EKS_CLUSTER_NAME: techchallenger-fase1
  DB_PARAM_PREFIX: /techchallenger/db

jobs:
  database-migration:
    if: github.event.inputs.confirm_migration == 'yes'
    runs-on: ubuntu-latest
    environment: aws-deploy
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Credenciais temporárias do AWS Academy Learner Lab (expiram periodicamente e precisam ser renovadas nos secrets do repositório).
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Configurar kubeconfig do cluster EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region us-east-1

      - name: Publicar script e credenciais do banco no cluster
        run: |
          param() {
            aws ssm get-parameter --name "$DB_PARAM_PREFIX/$1" --with-decryption \
              --query 'Parameter.Value' --output text
          }
          host=$(param host)
          name=$(param name)
          username=$(param username)
          password=$(param password)
          echo "::add-mask::$password"

          kubectl create configmap db-migration-script \
            --from-file=migration.sql=database/init/01_schema.sql \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic db-migration-env \
            --from-literal=PGHOST="$host" \
            --from-literal=PGDATABASE="$name" \
            --from-literal=PGUSER="$username" \
            --from-literal=PGPASSWORD="$password" \
            --dry-run=client -o yaml | kubectl apply -f - > /dev/null

      - name: Remover execução anterior do Job de migração
        run: kubectl delete job db-migration --ignore-not-found=true

      - name: Rodar migração como Kubernetes Job no cluster EKS
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migration
            labels:
              app: techchallenger-db-migration
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: postgres:16-alpine
                    command: ["psql"]
                    args:
                      - "-v"
                      - "ON_ERROR_STOP=1"
                      - "-f"
                      - "/migrations/migration.sql"
                    env:
                      - name: PGSSLMODE
                        value: require
                    envFrom:
                      - secretRef:
                          name: db-migration-env
                    volumeMounts:
                      - name: migration-script
                        mountPath: /migrations
                volumes:
                  - name: migration-script
                    configMap:
                      name: db-migration-script
          EOF

      - name: Aguardar conclusão do Job de migração
        run: |
          if ! kubectl wait --for=condition=complete --timeout=120s job/db-migration; then
            echo "Migração falhou ou não completou a tempo. Logs do Job:"
            kubectl logs job/db-migration --all-containers
            exit 1
          fi
          kubectl logs job/db-migration

      - name: Remover credenciais do banco do cluster
        if: always()
        run: kubectl delete secret db-migration-env --ignore-not-found=true
